<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>관리자 · 굿즈 샵</title>
  <link rel="stylesheet" href="style.css">
  <meta name="theme-color" content="#3182f6">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon-180.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="굿즈샵">
</head>
<body>
  <header class="header" id="header"></header>

  <main class="container">
    <h1 class="page-title">전체 결제내역</h1>
    <p class="page-desc" id="summary">관리자만 모든 사람의 결제내역을 볼 수 있습니다.</p>
    <div id="message"></div>
    <div class="order-list" id="order-list"></div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="common.js"></script>
  <!-- 헤더의 장바구니 개수를 표시하려면 이 파일이 필요하다 -->
  <script src="cart.js"></script>
  <script>
    async function main() {
      await renderHeader("admin.html");

      const user = await requireLogin();
      if (!user) return;

      const message = document.getElementById("message");
      const list = document.getElementById("order-list");

      // 관리자가 아닌 사람이 이 주소로 들어올 수도 있다.
      // 화면에서 숨기는 것은 안내 목적일 뿐이고, 실제 차단은 DB 정책(RLS)이 한다.
      // 관리자가 아니면 아래 조회 결과가 "본인 주문"으로만 제한된다.
      if (user.email !== ADMIN_EMAIL) {
        message.innerHTML = `<div class="notice notice-info">
          관리자 계정이 아닙니다. 전체 내역은 볼 수 없습니다.
        </div>`;
      }

      const { data: rows, error } = await db
        .from("orders")
        .select("product_name, quantity, unit_price, amount, user_email, toss_order_id, created_at")
        .order("created_at", { ascending: false });

      if (error) {
        message.innerHTML +=
          `<div class="notice notice-error">불러오지 못했습니다: ${safe(error.message)}</div>`;
        return;
      }
      if (!rows.length) {
        list.innerHTML = `<p class="empty">결제내역이 없습니다.</p>`;
        return;
      }

      // 한 주문에 여러 상품이 들어가므로 주문번호로 묶는다.
      const orders = groupOrders(rows);

      // 합계는 줄 합계(amount)를 더한다. 낱개 가격을 더하면 틀린다.
      const total = orders.reduce((sum, order) => sum + order.total, 0);
      document.getElementById("summary").textContent =
        `주문 ${orders.length}건 · 합계 ${won(total)}`;

      list.innerHTML = orders.map((order) => {
        const lines = order.lines.map((line) => `
          <div class="order-item-line">
            <span class="summary-name">${safe(line.product_name)} × ${line.quantity}</span>
            <span class="summary-amount">${won(line.amount)}</span>
          </div>`).join("");

        return `
          <div class="order">
            <div class="order-top">
              <span class="order-name">상품 ${order.lines.length}종</span>
              <span class="order-amount">${won(order.total)}</span>
            </div>
            <div class="order-items">${lines}</div>
            <div class="order-meta">${dateText(order.createdAt)}</div>
            <div class="order-meta">주문번호 ${safe(order.tossOrderId)}</div>
            <span class="order-buyer">${safe(order.userEmail ?? "이메일 없음")}</span>
          </div>`;
      }).join("");
    }

    main();
  </script>
  <script src="pwa.js"></script>
</body>
</html>
