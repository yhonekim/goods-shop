<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>결제 실패 · 굿즈 샵</title>
  <link rel="stylesheet" href="style.css">
  <meta name="theme-color" content="#3182f6">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon-180.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="굿즈샵">
</head>
<body>
  <header class="header" id="header"></header>

  <main class="container">
    <div class="center-box">
      <h1>결제가 완료되지 않았어요</h1>
      <p id="reason"></p>
      <div class="stack">
        <a class="button" href="index.html">상품 목록으로</a>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="common.js"></script>
  <!-- 헤더의 장바구니 개수를 표시하려면 이 파일이 필요하다 -->
  <script src="cart.js"></script>
  <script>
    renderHeader("index.html");

    // 토스가 실패 이유를 주소에 담아 보내준다.
    const params = new URLSearchParams(location.search);
    const code = params.get("code");
    const text = params.get("message");

    document.getElementById("reason").textContent = text
      ? text + (code ? ` (${code})` : "")
      : "결제가 취소되었거나 중간에 중단되었습니다. 다시 시도해주세요.";
  </script>
  <script src="pwa.js"></script>
</body>
</html>
