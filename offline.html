<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#3182f6">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <title>인터넷 연결 없음 · 굿즈 샵</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <div class="center-box">
      <h1>인터넷이 연결되지 않았어요</h1>
      <p>
        이 화면은 아직 저장해두지 않아서 보여드릴 수 없습니다.<br>
        연결이 되면 다시 열어주세요.
      </p>
      <div class="stack">
        <button class="button" type="button" onclick="location.reload()">다시 시도</button>
        <a class="button button-line" href="index.html">상품 목록으로</a>
      </div>
    </div>
  </main>
  <!-- 이 페이지는 오프라인에서 뜨는 화면이라 Supabase 같은 외부 파일을 쓰지 않는다.
       외부 파일을 불러오면 인터넷이 없을 때 이 안내마저 안 보인다. -->
</body>
</html>
