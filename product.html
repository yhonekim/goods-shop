<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>상품 · 굿즈 샵</title>
  <link rel="stylesheet" href="style.css">
  <meta name="theme-color" content="#3182f6">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon-180.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="굿즈샵">
</head>
<body>
  <header class="header" id="header"></header>

  <main class="container">
    <div id="message"></div>

    <div class="detail" id="detail" hidden>
      <img class="detail-image" id="product-image" alt="">
      <div>
        <h1 class="detail-name" id="product-name"></h1>
        <p class="detail-desc" id="product-desc"></p>
        <p class="detail-price" id="product-price"></p>

        <div class="cart-item-actions">
          <div class="qty">
            <button class="qty-button" id="qty-minus" type="button"
                    aria-label="수량 줄이기">−</button>
            <span class="qty-value" id="qty-value">1</span>
            <button class="qty-button" id="qty-plus" type="button"
                    aria-label="수량 늘리기">+</button>
          </div>
          <span class="cart-item-total" id="line-total"></span>
        </div>

        <div class="stack" style="margin-top: 16px;">
          <button class="button" id="buy-now" type="button">바로 구매</button>
          <button class="button button-line" id="add-cart" type="button">장바구니 담기</button>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="common.js"></script>
  <script src="cart.js"></script>
  <script>
    const message = document.getElementById("message");

    function showError(text) {
      message.innerHTML = `<div class="notice notice-error">${safe(text)}</div>`;
    }

    function showInfo(text) {
      message.innerHTML = `<div class="notice notice-info">${safe(text)}</div>`;
    }

    async function main() {
      await renderHeader("index.html");

      // 상품 상세는 로그인 없이도 볼 수 있고, 장바구니에도 담을 수 있다.
      // 로그인은 결제 단계(checkout.html)에서 요구한다.
      const productId = Number(new URLSearchParams(location.search).get("id"));
      if (!Number.isInteger(productId) || productId <= 0) {
        showError("상품 번호가 올바르지 않습니다.");
        return;
      }

      const { data: product, error } = await db
        .from("products")
        .select("id, name, image_url, price, description")
        .eq("id", productId)
        .single();

      if (error || !product) {
        showError("상품을 찾을 수 없습니다.");
        return;
      }

      // 상품 정보 표시
      document.title = product.name + " · 굿즈 샵";
      const image = document.getElementById("product-image");
      image.src = product.image_url;
      image.alt = product.name;
      document.getElementById("product-name").textContent = product.name;
      document.getElementById("product-desc").textContent = product.description ?? "";
      document.getElementById("product-price").textContent = won(product.price);
      document.getElementById("detail").hidden = false;

      // ---- 수량 조절 ----
      // 여기 금액은 안내용이다. 실제 청구 금액은 서버가 DB 가격으로 다시 계산한다.
      let quantity = 1;
      const MIN = 1, MAX = 99;
      const qtyValue = document.getElementById("qty-value");
      const minus = document.getElementById("qty-minus");
      const plus = document.getElementById("qty-plus");
      const lineTotal = document.getElementById("line-total");

      function drawQty() {
        qtyValue.textContent = quantity;
        lineTotal.textContent = won(product.price * quantity);
        minus.disabled = quantity <= MIN;
        plus.disabled = quantity >= MAX;
      }

      minus.addEventListener("click", () => {
        if (quantity > MIN) { quantity--; drawQty(); }
      });
      plus.addEventListener("click", () => {
        if (quantity < MAX) { quantity++; drawQty(); }
      });
      drawQty();

      // ---- 담기 / 바로 구매 ----
      document.getElementById("add-cart").addEventListener("click", () => {
        // 실제로 담긴 수량을 받아서 안내한다.
        // 이미 99개가 들어 있으면 0 이 돌아온다.
        const added = cartAdd(product.id, quantity);
        refreshCartCount();
        showInfo(added > 0
          ? `장바구니에 담았습니다. (${added}개)`
          : "이 상품은 이미 99개가 담겨 있어 더 담을 수 없습니다.");
      });

      document.getElementById("buy-now").addEventListener("click", () => {
        // 장바구니를 거치지 않고 이 상품만 결제한다.
        buyNowSet(product.id, quantity);
        location.href = "checkout.html?mode=buynow";
      });
    }

    main().catch((error) => showError(error.message));
  </script>
  <script src="pwa.js"></script>
</body>
</html>
