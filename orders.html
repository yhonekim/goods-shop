<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>내 결제내역 · 굿즈 샵</title>
  <link rel="stylesheet" href="style.css">
  <meta name="theme-color" content="#3182f6">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon-180.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="굿즈샵">
</head>
<body>
  <header class="header" id="header"></header>

  <main class="container">
    <h1 class="page-title">내 결제내역</h1>
    <p class="page-desc">내가 결제한 내역만 보입니다.</p>
    <div id="message"></div>
    <div class="order-list" id="order-list"></div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="common.js"></script>
  <!-- 헤더의 장바구니 개수를 표시하려면 이 파일이 필요하다 -->
  <script src="cart.js"></script>
  <script>
    async function main() {
      await renderHeader("orders.html");

      const user = await requireLogin();
      if (!user) return;

      // 조건을 따로 걸지 않아도 DB 정책(RLS)이 본인 주문만 돌려준다.
      const { data: rows, error } = await db
        .from("orders")
        .select("product_name, quantity, unit_price, amount, toss_order_id, created_at")
        .order("created_at", { ascending: false });

      const list = document.getElementById("order-list");

      if (error) {
        document.getElementById("message").innerHTML =
          `<div class="notice notice-error">불러오지 못했습니다: ${safe(error.message)}</div>`;
        return;
      }
      if (!rows.length) {
        list.innerHTML = `<p class="empty">아직 결제한 상품이 없습니다.</p>`;
        return;
      }

      // 한 주문에 여러 상품이 들어가므로 주문번호로 묶어서 한 덩어리로 보여준다.
      const orders = groupOrders(rows);

      list.innerHTML = orders.map((order) => {
        const lines = order.lines.map((line) => `
          <div class="order-item-line">
            <span class="summary-name">${safe(line.product_name)} × ${line.quantity}</span>
            <span class="summary-amount">${won(line.amount)}</span>
          </div>`).join("");

        return `
          <div class="order">
            <div class="order-top">
              <span class="order-name">상품 ${order.lines.length}종</span>
              <span class="order-amount">${won(order.total)}</span>
            </div>
            <div class="order-items">${lines}</div>
            <div class="order-meta">${dateText(order.createdAt)}</div>
            <div class="order-meta">주문번호 ${safe(order.tossOrderId)}</div>
          </div>`;
      }).join("");
    }

    main();
  </script>
  <script src="pwa.js"></script>
</body>
</html>
