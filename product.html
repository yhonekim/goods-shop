<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>상품 · 굿즈 샵</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="header" id="header"></header>

  <main class="container">
    <div id="message"></div>

    <div class="detail" id="detail" hidden>
      <img class="detail-image" id="product-image" alt="">
      <div>
        <h1 class="detail-name" id="product-name"></h1>
        <p class="detail-desc" id="product-desc"></p>
        <p class="detail-price" id="product-price"></p>

        <!-- 토스 결제위젯이 그려지는 자리 -->
        <div id="payment-method"></div>
        <div id="agreement"></div>

        <button class="button" id="pay-button" type="button" disabled>
          불러오는 중...
        </button>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://js.tosspayments.com/v2/standard"></script>
  <script src="config.js"></script>
  <script src="common.js"></script>
  <script>
    const message = document.getElementById("message");
    const payButton = document.getElementById("pay-button");

    function showError(text) {
      message.innerHTML = `<div class="notice notice-error">${safe(text)}</div>`;
    }

    async function main() {
      await renderHeader("index.html");

      // 결제는 로그인한 사람만 할 수 있다.
      // 로그인하지 않았으면 로그인 페이지로 보내고, 로그인 후 이 페이지로 돌아온다.
      const user = await requireLogin();
      if (!user) return;

      const productId = Number(new URLSearchParams(location.search).get("id"));
      if (!Number.isInteger(productId) || productId <= 0) {
        showError("상품 번호가 올바르지 않습니다.");
        return;
      }

      const { data: product, error } = await db
        .from("products")
        .select("id, name, image_url, price, description")
        .eq("id", productId)
        .single();

      if (error || !product) {
        showError("상품을 찾을 수 없습니다.");
        return;
      }

      // 상품 정보 표시
      document.title = product.name + " · 굿즈 샵";
      const image = document.getElementById("product-image");
      image.src = product.image_url;
      image.alt = product.name;
      document.getElementById("product-name").textContent = product.name;
      document.getElementById("product-desc").textContent = product.description ?? "";
      document.getElementById("product-price").textContent = won(product.price);
      document.getElementById("detail").hidden = false;

      // ---- 토스 결제위젯 준비 ----
      const tossPayments = TossPayments(TOSS_CLIENT_KEY);
      // customerKey 는 유추하기 어려운 값이어야 한다. 로그인 사용자의 고유 id 를 쓴다.
      const widgets = tossPayments.widgets({ customerKey: user.id });

      // 금액 설정은 화면을 그리기 전에 먼저 해야 한다.
      await widgets.setAmount({ currency: "KRW", value: product.price });

      await Promise.all([
        widgets.renderPaymentMethods({
          selector: "#payment-method",
          variantKey: "DEFAULT",
        }),
        widgets.renderAgreement({
          selector: "#agreement",
          variantKey: "AGREEMENT",
        }),
      ]);

      payButton.disabled = false;
      payButton.textContent = won(product.price) + " 결제하기";

      payButton.addEventListener("click", async () => {
        // 주문번호를 "<상품번호>-<임의의 UUID>" 로 만든다.
        // 상품번호를 주문번호에 넣어두면, 결제 승인 단계에서 어떤 상품이었는지
        // 브라우저 말을 믿지 않고 확인할 수 있다. 주문번호는 결제 시점에
        // 토스에 등록되므로 나중에 다른 상품으로 바꿔치기할 수 없다.
        const tossOrderId = product.id + "-" + crypto.randomUUID();

        try {
          await widgets.requestPayment({
            orderId: tossOrderId,
            orderName: product.name,
            successUrl: pageUrl("success.html"),
            failUrl: pageUrl("fail.html"),
            customerEmail: user.email,
          });
        } catch (error) {
          // 사용자가 결제창을 닫은 경우도 여기로 온다.
          showError(error.message ?? "결제를 시작할 수 없습니다.");
        }
      });
    }

    main().catch((error) => showError(error.message));
  </script>
</body>
</html>
