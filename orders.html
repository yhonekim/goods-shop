<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>내 결제내역 · 굿즈 샵</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="header" id="header"></header>

  <main class="container">
    <h1 class="page-title">내 결제내역</h1>
    <p class="page-desc">내가 결제한 내역만 보입니다.</p>
    <div id="message"></div>
    <div class="order-list" id="order-list"></div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="common.js"></script>
  <script>
    async function main() {
      await renderHeader("orders.html");

      const user = await requireLogin();
      if (!user) return;

      // 조건을 따로 걸지 않아도 DB 정책(RLS)이 본인 주문만 돌려준다.
      const { data: orders, error } = await db
        .from("orders")
        .select("product_name, amount, toss_order_id, created_at")
        .order("created_at", { ascending: false });

      const list = document.getElementById("order-list");

      if (error) {
        document.getElementById("message").innerHTML =
          `<div class="notice notice-error">불러오지 못했습니다: ${safe(error.message)}</div>`;
        return;
      }
      if (!orders.length) {
        list.innerHTML = `<p class="empty">아직 결제한 상품이 없습니다.</p>`;
        return;
      }

      list.innerHTML = orders.map((order) => `
        <div class="order">
          <div class="order-top">
            <span class="order-name">${safe(order.product_name)}</span>
            <span class="order-amount">${won(order.amount)}</span>
          </div>
          <div class="order-meta">${dateText(order.created_at)}</div>
          <div class="order-meta">주문번호 ${safe(order.toss_order_id)}</div>
        </div>`).join("");
    }

    main();
  </script>
</body>
</html>
